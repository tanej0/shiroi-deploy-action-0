name: Update blog frontend

on:
  push:
    branches: [main]
    paths: [update-request.json]
  workflow_dispatch:
    inputs:
      operation:
        description: 'Update frontend or restore the previous release'
        default: update
        type: choice
        options: [update, rollback, check]
      source_ref:
        description: 'Theme branch, tag or commit (main = latest)'
        required: true
        default: main
        type: string
      force:
        description: 'Rebuild even if this version was already deployed'
        default: false
        type: boolean
  repository_dispatch:
    types: [trigger-workflow]

# Editing deployment tools never deploys the live site.
permissions:
  contents: read
concurrency:
  group: yohaku-production
  cancel-in-progress: false

jobs:
  request:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      operation: ${{ steps.request.outputs.operation }}
      source_ref: ${{ steps.request.outputs.source_ref }}
      force: ${{ steps.request.outputs.force }}
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate update request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation || github.event.client_payload.operation || 'update' }}
          SOURCE_REF: ${{ inputs.source_ref || github.event.client_payload.source_ref || 'main' }}
          FORCE: ${{ inputs.force || github.event.client_payload.force || false }}
        run: node scripts/read-request.cjs

  update:
    needs: request
    if: needs.request.outputs.operation == 'update' || needs.request.outputs.operation == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      SOURCE_REPO: innei-dev/Yohaku
      OPERATION: ${{ needs.request.outputs.operation }}
      SOURCE_REF: ${{ needs.request.outputs.source_ref }}
      FORCE: ${{ needs.request.outputs.force }}
      BASE_URL: ${{ secrets.BASE_URL }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_GATEWAY_URL: ${{ secrets.NEXT_PUBLIC_GATEWAY_URL }}
      RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout deployment tools
        uses: actions/checkout@v4
        with:
          path: deployment
      - name: Check configuration
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          PASSWORD: ${{ secrets.PASSWORD }}
          KEY: ${{ secrets.KEY }}
        run: |
          node <<'NODE'
          for (const key of ['GH_PAT', 'HOST', 'USER', 'BASE_URL', 'NEXT_PUBLIC_API_URL', 'NEXT_PUBLIC_GATEWAY_URL']) {
            if (!process.env[key]) throw new Error(`Missing repository secret: ${key}`);
          }
          if (!process.env.PASSWORD && !process.env.KEY) throw new Error('Set KEY or PASSWORD');
          if (!/^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$/.test(process.env.SOURCE_REF)) throw new Error('Invalid source ref');
          if (!['true', 'false'].includes(process.env.FORCE)) throw new Error('force must be boolean');
          for (const key of ['BASE_URL', 'NEXT_PUBLIC_API_URL', 'NEXT_PUBLIC_GATEWAY_URL']) {
            const url = new URL(process.env[key]);
            if (!['http:', 'https:'].includes(url.protocol)) throw new Error(`Invalid URL: ${key}`);
          }
          NODE
      - name: Checkout selected theme version
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.GH_PAT }}
          path: source
          lfs: true
          submodules: recursive
          persist-credentials: false
      - name: Resolve selected source commit
        id: version
        run: |
          source_sha=$(git -C source rev-parse HEAD)
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          printf '## Blog update\n\n- Requested version: `%s`\n- Source commit: `%s`\n' "$SOURCE_REF" "$source_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Read version actually deployed on the server
        id: installed
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT || '22' }}
          capture_stdout: true
          script: |
            set -e
            if [ -f "$HOME/.bashrc" ]; then . "$HOME/.bashrc"; fi
            pid=$(pm2 pid Yohaku)
            if ! [[ $pid =~ ^[0-9]+$ && $pid -gt 0 ]]; then echo unknown; exit 0; fi
            directory=$(readlink -f "/proc/$pid/cwd")
            entry="$directory/server.js"
            commit_file="${entry%/standalone/apps/web/server.js}/source.commit"
            if [ -f "$commit_file" ]; then
              cat "$commit_file"
            else
              echo unknown
            fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check realtime compatibility and actual WebSocket events
        run: node deployment/scripts/check-realtime.cjs source/apps/web/src/socket/io.worker.ts
      - name: Skip only if the live version matches
        id: decision
        env:
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
          DEPLOYED_SHA: ${{ steps.installed.outputs.stdout }}
        run: |
          skip=false
          # ssh-action also captures its success banner; accept only a SHA line.
          deployed=$(printf '%s\n' "$DEPLOYED_SHA" | tr -d '\r' | grep -E '^[0-9a-f]{40}$' || true)
          if [[ "$OPERATION" == check ]]; then
            skip=true
            echo '- Check passed: repository secrets present, private source readable, server SSH connected. No deployment requested.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$FORCE" == false && "$SOURCE_SHA" == "$deployed" ]]; then
            skip=true
            echo '- Already deployed; no server changes.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - name: Set up pnpm declared by the theme
        if: steps.decision.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: source/package.json
      - name: Install locked dependencies
        if: steps.decision.outputs.skip != 'true'
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        if: steps.decision.outputs.skip != 'true'
        working-directory: source
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: pnpm --filter @yohaku/web build:ci
      - name: Package standalone output
        if: steps.decision.outputs.skip != 'true'
        env:
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
        run: bash deployment/scripts/package.sh source upload
      - name: Upload release and deployment script
        if: steps.decision.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT || '22' }}
          source: upload/*
          strip_components: 1
          target: /tmp/yohaku-${{ env.RELEASE_ID }}
      - name: Check candidate and switch frontend
        if: steps.decision.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.2.5
        env:
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT || '22' }}
          command_timeout: 6m
          envs: RELEASE_ID,SOURCE_SHA
          script: |
            set -e
            if [ -f "$HOME/.bashrc" ]; then . "$HOME/.bashrc"; fi
            bash "/tmp/yohaku-$RELEASE_ID/deploy.sh" deploy "/tmp/yohaku-$RELEASE_ID" "$RELEASE_ID" "$SOURCE_SHA"
      - name: Record successfully deployed version
        if: steps.decision.outputs.skip != 'true'
        working-directory: deployment
        env:
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          printf '%s\n' "$SOURCE_SHA" > build_hash
          git add build_hash
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: record deployed frontend version'
            git push origin HEAD:main
          fi
      - name: Report result
        if: always() && steps.decision.outputs.skip != 'true'
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '\n- Result: **%s**\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo '- Candidate is checked before switching; a failed switch attempts rollback.' >> "$GITHUB_STEP_SUMMARY"

  rollback:
    needs: request
    if: needs.request.outputs.operation == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Restore previous frontend and check health
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT || '22' }}
          command_timeout: 6m
          script: |
            set -e
            if [ -f "$HOME/.bashrc" ]; then . "$HOME/.bashrc"; fi
            test -f "$HOME/yohaku/deploy.sh" || { echo 'Rollback becomes available after the first update with this workflow.'; exit 1; }
            bash "$HOME/yohaku/deploy.sh" rollback
      - name: Report rollback result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf '## Frontend rollback\n\nResult: **%s**\n' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
