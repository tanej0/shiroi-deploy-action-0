name: Validate deployment tools
on:
  push:
    paths: ['.github/**', 'scripts/**', 'tests/**', 'rollback.sh', 'pm2/**']
  pull_request:
    paths: ['.github/**', 'scripts/**', 'tests/**', 'rollback.sh', 'pm2/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and deployment scenarios
        run: |
          bash -n scripts/deploy.sh scripts/package.sh rollback.sh
          python3 -m unittest discover -s tests -v
      - name: Validate GitHub Actions configuration
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          mkdir -p /tmp/actionlint-bin
          tar -xzf /tmp/actionlint.tar.gz -C /tmp/actionlint-bin actionlint
          /tmp/actionlint-bin/actionlint -shellcheck= -pyflakes=
